name: Build

on:
  push:
    branches: [ spm_import ]
  pull_request:
    branches: [ spm_import ]
  workflow_dispatch:

jobs:
  build-xcode:
    name: Build iOS and macOS apps
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build for iOS simulator
        run: |
          xcodebuild build \
          -project appleApp/appleApp.xcodeproj \
          -configuration Debug \
          -scheme appleApp \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO

      - name: Build for macOS
        run: |
          xcodebuild build \
          -project appleApp/appleApp.xcodeproj \
          -configuration Debug \
          -scheme appleApp \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO
